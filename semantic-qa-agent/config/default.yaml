# =============================================================================
# Semantic Q&A Agent — single source of truth for every tunable knob.
# Principle #4 from the PRD: "Config over code — no magic numbers in source."
# Phase 1 uses the `ingest` and `chunking` sections. The remaining sections are
# declared now so that Phase 2/3 components have a stable contract to load.
# =============================================================================

project: semantic-qa-agent
seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  storage_dir: storage
  reports_dir: reports
  logs_dir: logs

ingest:
  supported_extensions: [.pdf, .docx, .md, .txt, .html, .htm, .csv]
  recursive: true
  max_file_mb: 200
  # A page yielding fewer than this many characters is almost certainly a
  # scanned image with no text layer -> reported, not silently dropped.
  scanned_page_char_threshold: 50

cleaning:
  normalize_unicode: true
  fix_ligatures: true
  dedupe_hyphenation: true          # "infor-\nmation" -> "information"
  collapse_whitespace: true
  strip_boilerplate: true
  # A line repeated on more than this fraction of pages is a header/footer.
  boilerplate_page_ratio: 0.6
  strip_page_numbers: true

chunking:
  strategy: recursive               # recursive | sentence
  chunk_size_tokens: 128
  overlap_tokens: 24
  min_chunk_chars: 30               # drop fragments smaller than this
  max_non_alnum_ratio: 0.8          # drop garbage/OCR-noise chunks
  prefix_with_heading: true         # "[Doc > Section] text" -> better retrieval
  separators: ["\n\n", "\n", ". ", "? ", "! ", "; ", ", ", " "]

# ---- Declared for Phase 2 / Phase 3 (not consumed in Phase 1) ---------------
embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  dim: 384
  batch_size: 64
  normalize: true
  cache_path: .cache/embeddings.sqlite

store:
  backend: chroma
  path: storage/chroma
  collection: docs_v1
  hnsw: {space: cosine, construction_ef: 200, M: 32}

retrieval:
  dense_top_n: 25
  bm25_top_n: 25
  hybrid: true
  fusion: rrf
  rrf_k: 60
  final_top_k: 5

rerank:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  max_candidates: 40

gate:
  refusal_threshold: 0.40
  refusal_message: "I could not find information about this in the provided documents."

generation:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0.0
  num_ctx: 4096
  max_context_tokens: 3000
  max_answer_words: 150

eval:
  golden_set: data/golden_set.jsonl
  k_values: [1, 3, 5, 10]
